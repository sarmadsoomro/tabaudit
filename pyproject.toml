[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabaudit"
version = "0.1.0"
description = "A leakage-audit protocol for tabular regression: matched leaky/clean preprocessing arms, paired cross-validation, and a Nadeau-Bengio-corrected TOST equivalence test."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Mahrukh Hakim" },
    { name = "Sarmad Soomro" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "scikit-learn>=1.2",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=7", "statsmodels>=0.14"]

# [project.urls]
Repository = "https://github.com/sarmadsoomro/tabaudit"

[tool.setuptools.packages.find]
where = ["src"]
